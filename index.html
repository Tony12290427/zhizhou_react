<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/zhizhou.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知舟 - 图文社区</title>
    <script>
      // Apply theme BEFORE React renders to prevent flash of wrong theme.
      // Mirrors the Vue3 reference project's initTheme() called before app.mount().
      (function() {
        var theme = localStorage.getItem('theme') || 'system'
        var actual = theme === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme
        document.documentElement.setAttribute('data-theme', actual)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
